   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263746" x="11.52" y="16.238438" transform="rotate(-0 11.52 16.238438)">A  Study inputs and functional definitions</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #315d77" x="20.88" y="53.525125" transform="rotate(-0 20.88 53.525125)">Blood discovery | GSE123568</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 74.706703)">30 SONFH + 10 GC-exposed non-SONFH</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 84.946893)">Deposited RMA + GPL15207 annotation</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 95.187083)">Probe-to-gene median → 18,833 genes × 40</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #315d77" x="274.32" y="53.486625" transform="rotate(-0 274.32 53.486625)">Literature-guided functional panel</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(274.32 74.706703)">6 predefined domains; 85 frozen gene sets</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(274.32 84.946893)">28 functional groups; 21 with ≥2 sets</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(274.32 95.187083)">11 predefined opposing-process pairs</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263746" x="259.2" y="159.858516" transform="rotate(-0 259.2 159.858516)">GSVA scoring across all 40 blood samples</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263746" x="11.52" y="185.438438" transform="rotate(-0 11.52 185.438438)">B  Three prespecified parallel questions</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #315d77" x="20.88" y="235.685125" transform="rotate(-0 20.88 235.685125)">Layer 1 | Association</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 256.866703)">Which functions are</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 267.106893)">associated with SONFH?</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 277.347083)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 287.587273)">85 sets; sex-adjusted HC3</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 297.827463)">BH across 85 tests</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #286c60" x="190.08" y="235.685125" transform="rotate(-0 190.08 235.685125)">Layer 2 | Effect differences</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(190.08 256.866703)">Do related components have</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(190.08 267.106893)">distinguishable effects?</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(190.08 277.347083)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(190.08 287.587273)">21 groups; standardized scores</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(190.08 297.827463)">Sex-adjusted CR2; BH across 21</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a622e" x="359.28" y="235.685125" transform="rotate(-0 359.28 235.685125)">Layer 3 | Process contrasts</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(359.28 256.866703)">Are opposing-process</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(359.28 267.106893)">differences associated?</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(359.28 277.347083)"/>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(359.28 287.587273)">11 contrasts: z(A) − z(B)</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(359.28 297.827463)">Sex-adjusted HC3; BH across 11</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263746" x="259.2" y="349.558594" transform="rotate(-0 259.2 349.558594)">Distinct questions; no sequential significance filter.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263746" x="11.52" y="375.518438" transform="rotate(-0 11.52 375.518438)">C  Sensitivity analyses and exploratory follow-up</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #315d77" x="20.88" y="399.086625" transform="rotate(-0 20.88 399.086625)">Blood-based characterization</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 420.306703)">Alternative scoring; membership; leave-one-out</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(20.88 430.546893)">Erythroid expression proxy; component analysis</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #315d77" x="274.32" y="399.086625" transform="rotate(-0 274.32 399.086625)">Exploratory tissue assessment</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(274.32 420.306703)">GSE345158: 5 SONFH + 4 fracture controls</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(274.32 430.546893)">Exact permutation; shared-gene sensitivity</text>
   </g>
